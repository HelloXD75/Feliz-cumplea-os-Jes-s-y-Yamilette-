<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>¡Fiesta de Cumpleaños! Jesús y Yamilette</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --pink: #FF4D8D;
    --pink-deep: #E11F73;
    --yellow: #FFC93C;
    --turquoise: #2EC4B6;
    --purple: #6A2C70;
    --cream: #FFF8ED;
    --ink: #3A1B3E;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  *{box-sizing:border-box;}
  html{scroll-padding-top: env(safe-area-inset-top, 0px);}
  html,body{height:100%;}
  body{
    margin:0;
    min-height:100%;
    font-family:'Nunito', sans-serif;
    color: var(--ink);
    background:
      radial-gradient(circle at 15% 10%, rgba(255,201,60,0.35), transparent 45%),
      radial-gradient(circle at 85% 15%, rgba(46,196,182,0.30), transparent 45%),
      radial-gradient(circle at 50% 90%, rgba(255,77,141,0.25), transparent 50%),
      linear-gradient(180deg, #FFF3E0 0%, #FFF8ED 45%, #FFEFF6 100%);
    overflow-x:hidden;
    position:relative;
  }

  /* ---------- confetti ---------- */
  .confetti-layer{
    position:fixed; inset:0; pointer-events:none; z-index:2; overflow:hidden;
  }
  .confetto{
    position:absolute; top:-40px;
    width:10px; height:16px;
    opacity:0.9;
    animation-name: fall;
    animation-timing-function: linear;
    animation-iteration-count: infinite;
    will-change: transform;
    border-radius:2px;
  }
  @keyframes fall{
    0%   { transform: translateY(-10vh) translateX(0) rotate(0deg); }
    100% { transform: translateY(115vh) translateX(var(--drift,20px)) rotate(360deg); }
  }
  @media (prefers-reduced-motion: reduce){
    .confetto{ animation: none; opacity:0.5; }
    .balloon{ animation: none !important; }
  }

  /* ---------- layout ---------- */
  .wrap{
    position:relative; z-index:3;
    max-width: 640px;
    margin: 0 auto;
    padding: 48px 24px 64px;
    min-height:100%;
  }

  .card{
    background: rgba(255,255,255,0.72);
    backdrop-filter: blur(6px);
    border: 2px solid rgba(255,255,255,0.9);
    border-radius: 32px;
    box-shadow: 0 24px 60px -20px rgba(106,44,112,0.35), 0 4px 16px rgba(255,77,141,0.15);
    padding: 40px 32px 44px;
    text-align:center;
    position:relative;
    overflow:hidden;
    animation: cardIn 0.9s cubic-bezier(.2,.8,.2,1) both;
  }
  @keyframes cardIn{
    0%{ opacity:0; transform: translateY(24px) scale(0.98); }
    100%{ opacity:1; transform: translateY(0) scale(1); }
  }

  .banner-emoji{
    font-size: 2.4rem;
    line-height:1;
    margin-bottom: 6px;
  }

  .kicker{
    font-family:'Baloo 2', cursive;
    font-weight:700;
    font-size: 1.35rem;
    color: var(--pink-deep);
    letter-spacing: 0.3px;
    margin: 4px 0 18px;
  }

  .names{
    font-family:'Baloo 2', cursive;
    font-weight:800;
    font-size: clamp(2.4rem, 9vw, 3.6rem);
    line-height:1.05;
    margin: 6px 0 4px;
    background: linear-gradient(100deg, var(--pink-deep) 0%, var(--pink) 35%, #FF8A3D 65%, var(--yellow) 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    filter: drop-shadow(0 3px 0 rgba(255,255,255,0.6));
  }

  .subtitle{
    font-size: 1.05rem;
    font-weight:700;
    color: var(--purple);
    margin: 2px 0 26px;
  }

  .divider{
    width: 72px; height: 5px; margin: 0 auto 26px;
    border-radius: 6px;
    background: linear-gradient(90deg, var(--turquoise), var(--yellow), var(--pink));
  }

  .cake-scene{
    margin: 6px auto 24px;
    width: 150px;
    height: 130px;
    position: relative;
  }

  .details{
    display:flex;
    flex-direction:column;
    gap:14px;
    margin: 8px auto 30px;
    max-width: 420px;
  }
  .detail-row{
    display:flex;
    align-items:center;
    gap:14px;
    background: rgba(255,255,255,0.65);
    border: 1.5px solid rgba(255,201,60,0.6);
    border-radius: 18px;
    padding: 14px 18px;
    text-align:left;
  }
  .detail-emoji{
    font-size: 1.6rem;
    flex: 0 0 auto;
    width: 40px; height:40px;
    display:flex; align-items:center; justify-content:center;
    background: #fff;
    border-radius: 50%;
    box-shadow: 0 4px 10px rgba(106,44,112,0.12);
  }
  .detail-text{
    font-size: 1.08rem;
    font-weight: 700;
    color: var(--ink);
    line-height:1.3;
  }
  .detail-text .small{
    display:block;
    font-size:0.82rem;
    font-weight:700;
    color: var(--pink-deep);
    letter-spacing:0.3px;
    margin-bottom:1px;
  }

  .rsvp-message{
    font-family:'Baloo 2', cursive;
    font-weight:700;
    font-size: 1.3rem;
    color: var(--purple);
    margin: 6px 0 0;
    line-height:1.4;
  }
  .rsvp-message span.heart{ display:inline-block; }

  .footer-balloons{
    margin-top: 22px;
    font-size: 1.6rem;
    letter-spacing: 10px;
  }

  /* ---------- floating balloons (outside card, decorative) ---------- */
  .balloon{
    position:absolute;
    z-index:1;
    filter: drop-shadow(0 8px 10px rgba(106,44,112,0.18));
    animation: bob 6s ease-in-out infinite;
  }
  @keyframes bob{
    0%,100%{ transform: translateY(0) rotate(-3deg); }
    50%{ transform: translateY(-22px) rotate(3deg); }
  }

  @media (max-width: 480px){
    .card{ padding: 32px 20px 36px; border-radius: 26px; }
    .details{ gap: 12px; }
  }
</style>
</head>
<body>

<div class="confetti-layer" id="confettiLayer"></div>

<!-- decorative floating balloons -->
<svg class="balloon" style="left:4%; top:8%; width:56px; animation-delay:0s;" viewBox="0 0 60 90" xmlns="http://www.w3.org/2000/svg">
  <ellipse cx="30" cy="30" rx="26" ry="30" fill="#FF4D8D"/>
  <ellipse cx="21" cy="18" rx="7" ry="10" fill="#ffffff" opacity="0.35"/>
  <path d="M30 60 L26 66 L34 70 L28 76 L30 84" stroke="#B0308A" stroke-width="1.5" fill="none"/>
</svg>
<svg class="balloon" style="right:5%; top:5%; width:48px; animation-delay:1.4s;" viewBox="0 0 60 90" xmlns="http://www.w3.org/2000/svg">
  <ellipse cx="30" cy="30" rx="26" ry="30" fill="#2EC4B6"/>
  <ellipse cx="21" cy="18" rx="7" ry="10" fill="#ffffff" opacity="0.35"/>
  <path d="M30 60 L34 66 L26 70 L32 76 L30 84" stroke="#1C8E83" stroke-width="1.5" fill="none"/>
</svg>
<svg class="balloon" style="left:8%; bottom:6%; width:44px; animation-delay:2.6s;" viewBox="0 0 60 90" xmlns="http://www.w3.org/2000/svg">
  <ellipse cx="30" cy="30" rx="26" ry="30" fill="#FFC93C"/>
  <ellipse cx="21" cy="18" rx="7" ry="10" fill="#ffffff" opacity="0.4"/>
  <path d="M30 60 L26 66 L34 70 L28 76 L30 84" stroke="#D69C1E" stroke-width="1.5" fill="none"/>
</svg>
<svg class="balloon" style="right:6%; bottom:10%; width:52px; animation-delay:0.8s;" viewBox="0 0 60 90" xmlns="http://www.w3.org/2000/svg">
  <ellipse cx="30" cy="30" rx="26" ry="30" fill="#8E5FBF"/>
  <ellipse cx="21" cy="18" rx="7" ry="10" fill="#ffffff" opacity="0.35"/>
  <path d="M30 60 L34 66 L26 70 L32 76 L30 84" stroke="#5F3C86" stroke-width="1.5" fill="none"/>
</svg>

<div class="wrap">
  <div class="card">
    <div class="banner-emoji">🎉🎈🎂🎁🎉</div>
    <div class="kicker">¡Estás invitado a nuestra fiesta de cumpleaños!</div>

    <div class="names">Jesús y Yamilite</div>
    <div class="subtitle">¡Celebremos juntos este día tan especial!</div>

    <div class="divider"></div>

    <!-- cake illustration -->
    <svg class="cake-scene" viewBox="0 0 150 130" xmlns="http://www.w3.org/2000/svg">
      <!-- plate -->
      <ellipse cx="75" cy="112" rx="58" ry="9" fill="#F3D9E4"/>
      <!-- bottom tier -->
      <rect x="30" y="78" width="90" height="32" rx="6" fill="#FF8FB3"/>
      <rect x="30" y="78" width="90" height="9" rx="4" fill="#FFB3CB"/>
      <!-- top tier -->
      <rect x="48" y="52" width="54" height="28" rx="6" fill="#FFC93C"/>
      <rect x="48" y="52" width="54" height="8" rx="4" fill="#FFDE85"/>
      <!-- drips -->
      <circle cx="55" cy="80" r="4" fill="#FF4D8D"/>
      <circle cx="75" cy="80" r="4" fill="#2EC4B6"/>
      <circle cx="95" cy="80" r="4" fill="#FF4D8D"/>
      <!-- candles -->
      <rect x="68" y="30" width="5" height="22" rx="2" fill="#6A2C70"/>
      <rect x="86" y="34" width="5" height="18" rx="2" fill="#2EC4B6"/>
      <rect x="50" y="36" width="5" height="16" rx="2" fill="#FF4D8D"/>
      <!-- flames -->
      <ellipse cx="70.5" cy="26" rx="4" ry="6" fill="#FFB13C"/>
      <ellipse cx="88.5" cy="30" rx="3.5" ry="5.5" fill="#FFB13C"/>
      <ellipse cx="52.5" cy="32" rx="3.5" ry="5.5" fill="#FFB13C"/>
      <!-- sprinkles -->
      <rect x="40" y="92" width="6" height="2.5" rx="1.2" fill="#6A2C70" transform="rotate(20 40 92)"/>
      <rect x="108" y="96" width="6" height="2.5" rx="1.2" fill="#2EC4B6" transform="rotate(-15 108 96)"/>
      <rect x="60" y="100" width="6" height="2.5" rx="1.2" fill="#FF4D8D" transform="rotate(10 60 100)"/>
      <rect x="90" y="102" width="6" height="2.5" rx="1.2" fill="#FFC93C" transform="rotate(-20 90 102)"/>
    </svg>

    <div class="details">
      <div class="detail-row">
        <div class="detail-emoji">📅</div>
        <div class="detail-text"><span class="small">Fecha</span>28 de septiembre</div>
      </div>
      <div class="detail-row">
        <div class="detail-emoji">🕠</div>
        <div class="detail-text"><span class="small">Hora</span>5:30 PM</div>
      </div>
      <div class="detail-row">
        <div class="detail-emoji">📍</div>
        <div class="detail-text"><span class="small">Lugar</span>6454 S Francisco Ave</div>
      </div>
    </div>

    <div class="rsvp-message">¡Esperamos verte para celebrar juntos! <span class="heart">💖</span></div>
    <div class="footer-balloons">🎈🎁🎂🎈</div>
  </div>
</div>

<script>
(function(){
  var layer = document.getElementById('confettiLayer');
  var colors = ['#FF4D8D','#FFC93C','#2EC4B6','#8E5FBF','#FF8A3D'];
  var count = window.innerWidth < 480 ? 22 : 34;
  var frag = document.createDocumentFragment();
  for (var i = 0; i < count; i++){
    var c = document.createElement('div');
    c.className = 'confetto';
    var left = Math.random()*100;
    var duration = 6 + Math.random()*6;
    var delay = Math.random()*8;
    var drift = (Math.random()*80 - 40) + 'px';
    var color = colors[i % colors.length];
    c.style.left = left + 'vw';
    c.style.background = color;
    c.style.setProperty('--drift', drift);
    c.style.animationDuration = duration + 's';
    c.style.animationDelay = '-' + delay + 's';
    if (Math.random() > 0.5){
      c.style.borderRadius = '50%';
      c.style.width = '9px';
      c.style.height = '9px';
    }
    frag.appendChild(c);
  }
  layer.appendChild(frag);
})();
</script>

</body>
</html>
